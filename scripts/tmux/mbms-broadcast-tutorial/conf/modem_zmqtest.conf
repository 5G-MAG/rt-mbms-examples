modem: {
  sdr: {
    center_frequency_hz = 667000000L;
    filter_bandwidth_hz =   10000000;
    search_sample_rate_hz = 15360000;

    normalized_gain = 0.0;
    # native_srate: tells the bridge the wire's actual native rate, so it
    # decimates down when the modem requests a narrower one (e.g. n_prb=25).
    # MUST match the eNB's own enb_baseline.conf device_args base_srate
    # exactly (both are just hardcoded literals, neither derives from n_prb
    # automatically). Confirmed fix for n_prb=75/100 (2026-07-18, see
    # SIB13_MBSFN_TEST_RESULTS.md): set base_srate/native_srate to the true
    # rate for whatever n_prb is under test (25->7.68e6 decimated from this
    # 15.36e6 baseline at ratio=2, 50->15.36e6 ratio=1, 75->23.04e6,
    # 100->30.72e6), AND keep receive-netns.sh's modem launch flag "-b" in
    # lockstep (-b 10/15/20 for 50/75/100-PRB-equivalent cell-search rate --
    # -b's value*5 = cs_nof_prb, which must match too or cell search fails
    # with a non-integer bridge decimation ratio). Currently at the n_prb=25
    # baseline (native_srate=15.36e6 matches base_srate; -b stays 10 -- the
    # 25 PRB case decimates during steady-state reception, not search).
    device_args = "driver=zmqrx,rx_port=tcp://127.0.0.1:2000,native_srate=15.36e6";
    antenna = "RX";
    rx_channels = 1;

    ringbuffer_size_ms = 200;
    reader_thread_priority_rt = 50;
  }

  # ETSI TS 103 720 clause 5.10 TV Service Configuration MO -- the receiver's
  # source for the search frequency (takes priority over sdr.center_frequency_hz
  # above), matching this test cell's PLMN (mcc=901,mnc=56). Configured MANUALLY
  # and INDEPENDENTLY of the eNB; keep this EARFCN the SAME as the eNB's
  # enb_baseline.conf [rf] frequency by default so transmit and receive agree.
  # FIXED 2026-07-14: was EARFCN 3350 (Band 7, 2680 MHz) -- did NOT match the
  # eNB's actual dl_freq=667000000 (Band 108, UHF terrestrial broadcast,
  # 470-698 MHz receive-only). EARFCN 73076 = 667.000 MHz exactly on Band 108,
  # computed via srsran_band_get_fd_band_all(108, ...) (the same function the
  # modem/eNB use internally), not hand-derived. This 2013 MHz mismatch was a
  # real config bug; part of the FeMBMS MBSFN CFO investigation (see
  # rt-mbms-modem/KNOWN_ISSUES.md and the fembms-mbsfn-cfo-investigation memory).
  tv_config: (
    {
      plmn_id = "90156";
      ran_info = [73076];
      # ROM SACH session parameters, provisioned via the TV MO (TS 26.346
      # clause 5.2.3.1.1 / TS 24.117). TMGI = service-id 0 + PLMN 901/56; the
      # SACH TSI (here 0) is provisioned here rather than hand-set in the
      # client config -- the client reads it from this MO. The SACH
      # multicast (224.0.0.120) and UDP port (55555) are spec-fixed (C.17 /
      # 5.2.3.1.1), so they are not provisioned.
      tmgi_list_for_sa = ( { tmgi = "00000009f165"; tsi = 0; } );
    }
  );

  phy: {
    threads = 4;
    thread_priority_rt = 10;
    # 0 = skip: SCHED_RR priority 20 for the main thread gets the process SIGKILLed
    # instantly in this host's sandbox (priority 10 for the phy pool threads is fine).
    main_thread_priority_rt = 0;
    # This cell is running MBMS-dedicated (enb_baseline.conf has mbms_dedicated=true):
    # real CAS, 1.25kHz PMCH SCS, and the pmch-Bandwidth-r17 extension are all in play.
    # expect_mixed_cell=false tells Phy.cpp's cell search to try the dedicated/CAS
    # hypothesis first, which is correct for a real dedicated cell (see Phy.cpp:168-183).
    expect_mixed_cell = false;
    # Seeds the MBSFN retune with the target PRB width directly, bypassing the
    # SIB13-discovery chicken-and-egg deadlock this ZMQ test harness hits for wideband
    # pmch_bandwidth. Matches enb_baseline.conf's pmch_bandwidth=40. 0 = no override.
    mbsfn_prb_test_override = 40;
  }

  restful_api: {
    uri: "http://0.0.0.0:3010/modem-api/";
    cert: "/usr/share/5gmag-rt/cert.pem";
    key: "/usr/share/5gmag-rt/key.pem";
    api_key:
    {
      enabled: false;
      key: "106cd60-76c8-4c37-944c-df21aa690c1e";
    }
  }

  measurement_file: {
    enabled: false;
    file_path: "/tmp/modem_measurements.csv";
    interval_secs: 10;
    gpsd:
    {
      enabled: false;
      host: "localhost";
      port: "2947";
    }
  }
}

client: {
  cache: {
    max_segments_per_stream: 30;
    max_file_age: 120;    /* seconds */
    max_total_size: 128; /* megabyte */
  }
  http_server: {
    uri: "http://0.0.0.0:3020/";
    api_path: "client-api";
    cert: "/usr/share/5gmag-rt/cert.pem";
    key: "/usr/share/5gmag-rt/key.pem";
    api_key:
    {
      enabled: false;
      key: "106cd60-76c8-4c37-944c-df21aa690c1e";
    }
  }
  control_system: {
    enabled: false;
    interval: 20; //seconds
    endpoint: "https://5gbc.ors-aws.cloud/obeca-api";
  }
  seamless_switching: {
    enabled: false;
    truncate_cdn_playlist_segments: 3
  }
  local_service: {
    enabled: false;
    bootstrap_file: "";
    mcast_address: "238.1.1.95:40085";
    lcid: 1;
    tmgi: "00000009f165";
  }
}
