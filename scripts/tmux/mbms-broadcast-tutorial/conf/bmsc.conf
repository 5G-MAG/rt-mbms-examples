[mbms_gw]
control_endpoint = 127.0.0.1:2101
tunnel_addr = 127.0.0.1
tunnel_port = 47000
[rom_sach]
enable = true
service_id = 0
tsi = 0
# MUST be the MME's Sm address (epc.conf [mme_sm]); the MME binds 0.0.0.0:2123
# and replies from 127.0.0.1:2123. The old 21999 was a dead port, so the SACH
# (service announcement) bearer never established over Sm/M3AP and the
# announcement never reached the air -- the client then never discovers the
# service. Keep this aligned with the session mmeSmPeers in the xMB templates.
mme_sm_peers = 127.0.0.1:2123
[content_session]
enable             = false
service_uri        = urn:3gpp:test-content-service
name               = Test Content Service (PMCH1 routing test)
tmgi_mcc           = 901
tmgi_mnc           = 56
tmgi_service_id    = 16
mcast_addr         = 239.255.1.1
port               = 6000
tsi                = 2
c_teid             = 52428
service_area_code  = 1
schedule_start     = 2026-01-01T00:00:00Z
schedule_stop      = 2099-12-31T23:59:59Z
mme_sm_peers       = 127.0.0.1:2123
[xmb]
enable = true
bind_addr = 127.0.0.1
bind_port = 8543
tls_cert_path = certs/server_cert.pem
tls_key_path = certs/server_key.pem
trusted_client_cert_path = certs/client_cert.pem
# How often the BM-SC re-reads the ingested manifest to find new segments. This is a
# discovery rate, not a re-announcement rate: the media playlist goes on the air only when
# its content actually changed, and each segment is sent exactly once, so polling faster
# costs local HTTP requests and nothing on the bearer.
#
# It should divide the segment duration, or the delivery cadence inherits the beat between
# the two: measured on this rig with 5 s segments and a 3 s poll, segments reached the
# receiver 3 s, 6 s and 7 s apart rather than every 5 s, because the poll grid and the
# publication grid drift against each other. At 1 s a new segment is found within a second
# of being published, whatever the segment duration is set to.
dash_repoll_interval_sec = 1
# Must clear the ingested content's own bitrate with real headroom: the
# transmitter sends every enqueued file (segments, playlists, ...) through one
# rate-limited queue, one file fully drained before the next starts (see
# rt-libflute Transmitter::send_next_packet()). If this limit sits at or below
# the source bitrate, the queue backs up indefinitely -- each new segment
# waits longer than the last before it's even fully put on the wire, until
# segments arrive too late for the client's live window and playback stalls
# ("segments no longer coming"), even though the RF link itself is clean.
# The current RTVE test variant advertises ~3.01 Mbps; keep this comfortably
# above whatever the ingested variant's own BANDWIDTH is, not just above it.
content_rate_limit_kbps = 6000
# Application-layer FEC for sessions that ask for it (fecEnabled, TS 26.348
# Table 5.4-1); this names the scheme the BM-SC applies when they do. Broadcast
# has no retransmission, so a single lost packet destroys the whole object it
# belonged to: measured on this rig with FEC off, a packet loss too small to move
# the radio's own BLER off 0 still cost ~7% of HLS segments, because a ~250 KB
# segment spans ~180 packets and needs every one of them. Raptor (RFC 5053) is
# the scheme the 3GPP profiles admit; RaptorQ is refused under them.
content_fec_scheme = raptor
[log]
all_level = debug
filename = stdout
