// the client configured to receive from the OTHER session's already-running,
// already-forwarding modem (10MHz RTP, API on :3011, writing MTCH to
// mbms_modem_tun). Read-only toward their modem; the client just polls mch_info and
// joins the multicast groups on the tun. Launch:  ./build/client -c client_recv.conf -i 192.168.180.10 -l 2
modem: {
  restful_api: {
    uri: "http://localhost:3010/modem-api/";
  }
}

client: {
  cache: {
    // The served media playlist lists only segments actually cached (see
    // ContentStream / generate_hls_media_playlist_from_available), so the cache
    // just needs the live window the BM-SC advertises (~10 segments) plus a
    // little margin for the player's buffer -- not a long DVR-style retention.
    max_segments_per_stream: 20;
    max_file_age: 90;
    max_total_size: 48;
  }
  http_server: {
    uri: "http://0.0.0.0:3020/";
    api_path: "client-api";
    cert: "/usr/share/5gmag-rt/cert.pem";
    key: "/usr/share/5gmag-rt/key.pem";
    api_key: { enabled: false; key: "106cd60-76c8-4c37-944c-df21aa690c1e"; }
  }
  control_system: { enabled: false; interval: 20; endpoint: ""; }
  seamless_switching: { enabled: false; truncate_cdn_playlist_segments: 3 }
  // Fallback only: the ROM SACH TSI is now provisioned via the TV MO
  // (modem tv_config tmgi_list_for_sa) and read from there. This value is used
  // only if the MO has no matching SA TMGI. Kept aligned at 0.
  service_announcement_tsi: 0;
  local_service: {
    enabled: false;
    bootstrap_file: "";
    mcast_address: "238.1.1.95:40085";
    lcid: 1;
    tmgi: "00000009f165";
  }
}
